[project]
name = "deerflow-extension-scholar"
version = "0.3.2"
description = "arXiv search with code-side filtering, batch hand-off to subagents, and a citation gate for DeerFlow"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "deerflow-extension-api>=0.2.8,<0.3",
    "httpx>=0.27",
    "langchain>=1.0",
    "langchain-core>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.entry-points."deerflow.extensions"]
scholar = "deerflow_extension_scholar:install"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deerflow_extension_scholar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 240
target-version = "py312"
